{% extends 'base.html' %}
{% block title %}首次设置 · {{ app_name }}{% endblock %}
{% block body_class %}gate{% endblock %}
{% block chrome %}{% endblock %}

{% block content %}
<div class="gate__wrap gate__wrap--narrow">
  <div class="gate__logo">
    <img class="brand__mark brand__mark--xl" src="{{ url_for('static', filename='icons/icon.svg') }}" alt="" width="92" height="92">
    <h1 class="gate__title">欢迎使用 {{ app_name }}</h1>
    <p class="gate__sub">创建首位家长账户并设置家庭信息。</p>
  </div>

  <form class="card card--form" method="post">
    {{ csrf_field() }}
    <label class="field">
      <span>你的姓名</span>
      <input name="name" required autocomplete="name" placeholder="家长姓名">
    </label>
    <label class="field">
      <span>邮箱</span>
      <input name="email" type="email" required autocomplete="username">
    </label>
    <label class="field">
      <span>密码</span>
      <input name="password" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <label class="field">
      <span>确认密码</span>
      <input name="confirm" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <label class="field"><span>家庭名称</span><input name="family_name" maxlength="80" required value="我们的家"></label>
    <label class="field"><span>家庭时区</span><input name="timezone" required value="Asia/Shanghai"></label>
    <button class="btn btn--primary btn--block" type="submit">创建账户并继续</button>
  </form>
</div>
{% endblock %}
